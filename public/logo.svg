<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12d6a0" />
      <stop offset="60%" stop-color="#5c7cff" />
      <stop offset="100%" stop-color="#93a5ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Ascending Geometric Mark -->
  <g transform="translate(10, 8)">
    <rect x="0" y="24" width="7" height="18" rx="3.5" fill="url(#brandGrad)" opacity="0.6" />
    <rect x="11" y="14" width="7" height="28" rx="3.5" fill="url(#brandGrad)" opacity="0.85" />
    <rect x="22" y="2" width="7" height="40" rx="3.5" fill="url(#brandGrad)" filter="url(#glow)" />
    <!-- Dynamic Accent dot -->
    <circle cx="25.5" cy="5" r="2" fill="#ffffff" />
  </g>
  <!-- Wordmark -->
  <text x="56" y="38" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5" fill="currentColor">
    Ryze<tspan fill="url(#brandGrad)">Log</tspan>
  </text>
</svg>
